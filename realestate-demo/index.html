<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منصة ذكاء الإيرادات العقارية</title>
  <meta name="description" content="منصة موحدة لإدارة رحلة العميل العقاري وتحليل الأداء والإيرادات." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">R</div><div><div class="brand-title">Revenue Intelligence</div><div class="brand-sub">Real Estate Platform</div></div></div>
      <div class="org-switch"><div class="org-avatar">ع</div><div class="org-meta"><strong>المجموعة العقارية</strong><span>الرياض، السعودية</span></div><button class="icon-btn">⌄</button></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer"><button class="support-card"><span class="support-icon">✦</span><span><strong>مساعد التحليلات</strong><small>اسأل عن أي مؤشر أو حملة</small></span></button><div class="user-box"><div class="user-avatar">م</div><div><strong>محمد العتيبي</strong><span>مدير الإيرادات</span></div><button class="icon-btn">•••</button></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="mobile-left"><button class="menu-btn" id="menuBtn">☰</button><div class="breadcrumbs"><span>المنصة</span><b>/</b><strong id="crumb">لوحة الإدارة التنفيذية</strong></div></div><div class="top-actions"><div class="date-filter">آخر 30 يوم <span>⌄</span></div><button class="top-icon">⌕</button><button class="top-icon notification">♢<i></i></button><button class="primary-btn" id="newLeadBtn">+ عميل محتمل جديد</button></div></header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div class="modal" id="leadModal"><div class="modal-card"><div class="modal-header"><div><h3>إضافة عميل محتمل</h3><p>تسجيل العميل وربطه تلقائيًا بالمصدر والحملة.</p></div><button id="closeModal" class="icon-btn">✕</button></div><div class="form-grid"><label>الاسم الكامل<input value="عبدالله السبيعي"></label><label>رقم الجوال<input value="05 5XX XXX 221"></label><label>المشروع<select><option>واجهة الرياض السكنية</option><option>بوابة الشمال</option></select></label><label>المصدر<select><option>Google Ads</option><option>Meta</option><option>WhatsApp</option><option>Broker</option></select></label><label>الحملة<select><option>حملة الربع الثالث</option><option>إطلاق المشروع</option></select></label><label>نوع العقار<select><option>شقة</option><option>فيلا</option><option>تاون هاوس</option></select></label></div><div class="modal-actions"><button class="ghost-btn" id="cancelModal">إلغاء</button><button class="primary-btn" id="saveLead">حفظ العميل</button></div></div></div>
  <div id="toast" class="toast">تم حفظ العميل وربطه بالمصدر والحملة</div>
  <script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script><script src="app4.js"></script><script src="app5.js"></script>
</body>
</html>
