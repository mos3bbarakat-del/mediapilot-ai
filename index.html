<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MediaPilot AI</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019}iframe{display:block;width:100%;height:100%;border:0;background:#071019}
</style>
</head>
<body>
<iframe id="app" src="./demo.html" title="MediaPilot AI"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument; const w=frame.contentWindow;
  if(!d||!w)return;

  // Remove demo-only project navigation.
  d.querySelectorAll('.nav button').forEach(btn=>{
    if(btn.dataset.page==='project') btn.remove();
  });

  // Replace personal/demo alert with a clean empty state.
  const notice=d.querySelector('.notice');
  if(notice){
    notice.innerHTML=`<span class="eyebrow" data-ar="تنبيهاتك" data-en="YOUR ALERTS">تنبيهاتك</span><strong data-ar="لا توجد تنبيهات جديدة." data-en="No new alerts.">لا توجد تنبيهات جديدة.</strong><p class="muted" data-ar="ستظهر هنا التنبيهات المرتبطة بحسابك ومشاريعك عند بدء الاستخدام." data-en="Alerts related to your account and projects will appear here once you start using MediaPilot.">ستظهر هنا التنبيهات المرتبطة بحسابك ومشاريعك عند بدء الاستخدام.</p>`;
  }

  // Projects must start empty on a fresh public prototype.
  const projects=d.querySelector('#projects .grid');
  if(projects){
    projects.innerHTML=`<article class="project-card" style="grid-column:1/-1;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center"><div><h3 data-ar="لا توجد مشاريع حتى الآن" data-en="No projects yet">لا توجد مشاريع حتى الآن</h3><p class="muted" data-ar="ابدأ من الشات أو أنشئ مشروعك الأول." data-en="Start from chat or create your first project.">ابدأ من الشات أو أنشئ مشروعك الأول.</p><button class="btn primary" id="cleanCreateProject" data-ar="إنشاء مشروع جديد" data-en="Create New Project">إنشاء مشروع جديد</button></div></article>`;
    const b=d.getElementById('cleanCreateProject');
    if(b)b.addEventListener('click',()=>d.getElementById('newProject')?.click());
  }

  // Keep the hidden project workspace neutral if it is ever opened.
  const project=d.getElementById('project');
  if(project){
    const h=project.querySelector('.project-head h1');
    const p=project.querySelector('.project-head p');
    if(h){h.textContent='مشروع جديد';h.dataset.ar='مشروع جديد';h.dataset.en='New Project'}
    if(p){p.textContent='لم تتم إضافة بيانات المشروع بعد.';p.dataset.ar='لم تتم إضافة بيانات المشروع بعد.';p.dataset.en='Project details have not been added yet.'}
    project.querySelectorAll('.insight-row').forEach((row,i)=>{
      const span=row.querySelector('span');
      if(!span)return;
      const ar=['سيظهر هنا آخر اعتماد بعد بدء المشروع.','ستظهر هنا العناصر التي تحتاج إلى مراجعة.','سيعرض MediaPilot اقتراحاته تلقائيًا أثناء العمل.'][i]||'—';
      const en=['The latest approval will appear here once the project starts.','Items requiring review will appear here.','MediaPilot suggestions will appear automatically during work.'][i]||'—';
      span.textContent=ar; span.dataset.ar=ar; span.dataset.en=en;
    });
  }

  // Assistant is platform-wide until a project is opened.
  const status=d.querySelector('.assistant-head small');
  if(status){status.textContent='جاهز للعمل';status.dataset.ar='جاهز للعمل';status.dataset.en='Ready'}

  // Re-apply the current language after injecting the clean states.
  if(typeof w.applyLang==='function') w.applyLang();

  // Keep injected elements bilingual after each language toggle.
  const langBtn=d.getElementById('langBtn');
  if(langBtn) langBtn.addEventListener('click',()=>setTimeout(()=>{if(typeof w.applyLang==='function')w.applyLang()},0));
});
</script>
</body>
</html>
