services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mediapilot
      POSTGRES_USER: mediapilot
      POSTGRES_PASSWORD: mediapilot
    ports:
      - "5432:5432"
    volumes:
      - mediapilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediapilot -d mediapilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mediapilot_redis:/data

volumes:
  mediapilot_postgres:
  mediapilot_redis:
