name: ci

on:
  push:
    branches: [main, enterprise-v1]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/api[dev]"
      - run: pytest -q apps/api/tests

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:web

  staging-smoke:
    if: github.ref == 'refs/heads/enterprise-v1' && github.event_name == 'push'
    needs: [api-test, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check Core API health
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 --retry-all-errors https://mediapilot-api.onrender.com/health
      - name: Check projects API
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 --retry-all-errors https://mediapilot-api.onrender.com/v1/projects > /dev/null
      - name: Check enterprise web
        run: curl --fail --show-error --silent --location --retry 6 --retry-delay 5 --retry-all-errors https://mediapilot-enterprise.onrender.com/ > /dev/null
